name: release
on:
  push:
    tags: ["v*"]
# Every layer passes before anything publishes. The release job tests the
# tagged jar, and the publish job uploads that same jar.
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - run: mvn -B test
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - run: mvn -B verify -Pintegration
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - run: mvn -B versions:set -DnewVersion="${GITHUB_REF_NAME#v}" -DgenerateBackupPoms=false
      - run: mvn -B verify -Prelease
      - uses: actions/upload-artifact@v4
        with:
          name: jar
          path: target/kafka-connect-turbostats-*.jar
          if-no-files-found: error
      # What the fake control plane received, for anyone reading a failure.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-posts
          path: target/release/posts.jsonl
          if-no-files-found: ignore
  publish:
    needs: [unit, integration, release]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: jar
          path: dist
      - run: gh release create "$GITHUB_REF_NAME" dist/kafka-connect-turbostats-*.jar --repo "$GITHUB_REPOSITORY" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
